name: MoonBit CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.toolchain }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify toolchain and dependencies
        run: |
          moon version --all
          moon update
      - name: Check and test supported packages
        run: |
          for target in wasm wasm-gc js native; do
            moon check --target "$target"
            moon test --target "$target"
            moon test --target "$target" --release
          done
      - name: Check generated interfaces and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
